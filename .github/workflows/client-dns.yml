name: Client DNS
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libev-dev libpcre2-dev libudns-dev libmaxminddb-dev
      - run: autoreconf -fi && ./configure --enable-dns && make -j2
      - name: Test CIDR and country DNS routing
        run: |
          curl -fLsS https://raw.githubusercontent.com/maxmind/MaxMind-DB/55f9b2727fd5ab22ce175b475afbcd44c64dd009/test-data/GeoIP2-Country-Test.mmdb -o /tmp/test-country.mmdb
          sudo ip addr add 81.2.69.160/32 dev lo
          sudo ip addr add 81.2.69.161/32 dev lo
          sudo SNIPROXY_COUNTRY_DB=/tmp/test-country.mmdb python3 tests/client_dns_integration.py ./src/sniproxy
      - run: bash -n deploy/install.sh && python3 deploy/test_panel.py
      - name: Install and verify the systemd services
        run: |
          sudo PANEL_BIND=127.0.0.1 PANEL_HOST=127.0.0.1 bash deploy/install.sh
          sudo systemctl is-active sniproxy-managed.service sniproxy-panel.service sniproxy-adguard.service
          curl -fsS --noproxy '*' -o /dev/null http://127.0.0.1:3000/
          sudo test -f /etc/sniproxy-managed/adguard-integrated
          cert=/etc/sniproxy-managed/panel.crt
          base=https://127.0.0.1:9443/adguard/
          password=$(sudo cat /etc/sniproxy-managed/panel-password)
          test "$(sudo curl -sS --cacert "$cert" -o /dev/null -w '%{http_code}' "$base")" = 401
          sudo curl -fsS --cacert "$cert" --user "admin:$password" "$base" -o /tmp/adguard-ui.html
          grep -i 'AdGuard Home' /tmp/adguard-ui.html
          sudo curl -fsS --cacert "$cert" --user "admin:$password" "${base}control/status" | python3 -m json.tool
          test "$(sudo curl -sS --cacert "$cert" --user "admin:$password" -X POST -H 'Origin: https://evil.example' -o /dev/null -w '%{http_code}' "${base}control/status")" = 403
          sudo mmdblookup --file /etc/sniproxy-managed/country.mmdb --ip 8.8.8.8 country iso_code
          password=$(sudo cat /etc/sniproxy-managed/panel-password)
          sudo curl --fail --silent --show-error --cacert /etc/sniproxy-managed/panel.crt \
            --user "admin:$password" https://127.0.0.1:9443/ | grep -q 'SNIProxy 管理'
